[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lodstone"
version = "0.1.0a2"
description = "Renderer-neutral multiscale chunk planning and streaming"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Kyle I S Harrington" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
zarr = ["zarr>=3"]
datasets = ["zarr>=3"]
ome-zarr = ["zarr>=3", "fsspec>=2024.2", "aiohttp>=3.10"]
# Tested commit on kephale/zarr-vectors-py feat/bounded-mesh-reads.
# Replace with an upstream release containing MeshReader before publishing to PyPI.
mesh = ["zarr-vectors @ git+https://github.com/kephale/zarr-vectors-py@40bd38045e0c23019c5c88a54824b89f89243e4e"]
mesh-demo = ["lodstone[mesh]", "pygfx>=0.17", "rendercanvas>=2.7", "glfw>=2", "imageio>=2"]
biological-demo = ["lodstone[mesh-demo]", "scikit-image>=0.26", "scipy>=1.17", "fast-simplification>=0.2", "psutil>=7"]
test = ["lodstone[mesh]", "dask[array]>=2022.1.1", "pytest>=8", "zarr>=3"]

[dependency-groups]
dev = ["pyright>=1.1", "ruff>=0.12"]

[project.urls]
Repository = "https://github.com/kephale/lodstone"
Issues = "https://github.com/kephale/lodstone/issues"
Changelog = "https://github.com/kephale/lodstone/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/lodstone"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py311"
